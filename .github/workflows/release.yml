name: 发布

# 推一个 v 开头的 tag 就会打包并建 Release：
#     git tag v1.0.0 && git push origin v1.0.0
# 手动触发只打包、不建 Release，用来验证流水线本身没坏。
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write        # 建 Release、上传附件需要

env:
  # Windows 构建机的控制台是 cp1252，打印中文会抛 UnicodeEncodeError。
  # 代码入口自己也处理，这里再兜一层，覆盖 unittest 等间接的输出
  PYTHONUTF8: "1"
  PYTHONIOENCODING: "utf-8"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: Windows
          - os: macos-latest
            label: macOS
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      # 两个引擎的模型都要，缺一个 GradeRegister.spec 会拒绝打包
      - name: 缓存语音模型
        id: models
        uses: actions/cache@v4
        with:
          path: |
            models/sense-voice
            models/paraformer-zh
          key: models-sense-voice-paraformer-v1

      - name: 下载语音模型
        if: steps.models.outputs.cache-hit != 'true'
        run: python download_model.py --all

      # 逻辑测试是硬门槛：不过就别发版
      - name: 跑逻辑测试
        run: >
          python -m unittest tests.test_accuracy tests.test_console_encoding
          tests.test_core tests.test_paths tests.test_platform
          tests.test_recorder tests.test_samplerate tests.test_speech
          tests.test_speech_gate tests.test_voice_choice

      # 界面测试需要显示器，无头构建机跑不了，失败不拦发版
      - name: 跑界面测试
        run: python -m unittest tests.test_gui_smoke
        continue-on-error: true

      - name: 打包
        run: pyinstaller GradeRegister.spec --noconfirm

      - name: 版本号
        id: ver
        shell: bash
        run: |
          ref="${GITHUB_REF#refs/tags/}"
          if [ "$ref" = "$GITHUB_REF" ]; then ref="dev-${GITHUB_SHA::7}"; fi
          echo "version=$ref" >> "$GITHUB_OUTPUT"

      # Release 附件只能是单个文件，目录得先压起来
      - name: 压成 dmg（macOS）
        if: matrix.os == 'macos-latest'
        run: |
          hdiutil create -volname 成绩登记 \
            -srcfolder "dist/成绩登记.app" -ov -format UDZO \
            "GradeRegister-${{ steps.ver.outputs.version }}-macOS.dmg"

      - name: 压成 zip（Windows）
        if: matrix.os == 'windows-latest'
        shell: bash
        run: |
          7z a -mx=5 \
            "GradeRegister-${{ steps.ver.outputs.version }}-Windows.zip" \
            ./dist/GradeRegister

      - name: 上传
        uses: actions/upload-artifact@v4
        with:
          name: GradeRegister-${{ matrix.label }}
          path: |
            *.dmg
            *.zip
          retention-days: 14
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true

      - name: 建 Release
        uses: softprops/action-gh-release@v2
        with:
          files: assets/*
          generate_release_notes: true
          body: |
            语音成绩录入工具。语音识别全程本地离线，录音数据不出本机。

            **下载**

            - Windows：`GradeRegister-…-Windows.zip`，解压后双击文件夹里的
              `GradeRegister.exe`
            - macOS：`GradeRegister-…-macOS.dmg`，拖进「应用程序」。首次打开
              右键点图标 →「打开」→ 再点「打开」（没有苹果开发者签名）

            首次录音时系统会问麦克风权限，**必须点允许**。

            语音模型（sense-voice 与 paraformer）已经打进程序，不用联网、
            不用装 Python。
